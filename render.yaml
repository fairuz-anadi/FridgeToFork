# Render blueprint: one web service (React client + Laravel API in a single
# Docker container) and a PostgreSQL database.
# Deploy via Render Dashboard > New > Blueprint, pointing at this repository.

databases:
  - name: fridgetofork-postgres
    databaseName: fridgetofork
    user: fridgetofork
    plan: free
    region: singapore

services:
  - type: web
    name: fridgetofork
    runtime: docker
    dockerfilePath: ./docker/render/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /api/cuisines
    envVars:
      - key: APP_NAME
        value: FridgeToFork
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Random secret; start.sh turns it into a valid Laravel APP_KEY.
      - key: APP_KEY_SEED
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: fridgetofork-postgres
          property: connectionString
      - key: LOG_CHANNEL
        value: stderr
      - key: MAIL_MAILER
        value: log
      - key: NUTRITION_PROVIDER
        value: local
      # Optional: enables Claude in the recipe chatbot. Without it the chatbot
      # uses the built-in assistant. Set the value in the Render dashboard.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        value: 587227212522-eigpdur7u4l6vo5j9ltd0dnqe18m0qqn.apps.googleusercontent.com
      # Build-time value for the React client's Google sign-in button.
      - key: VITE_GOOGLE_CLIENT_ID
        value: 587227212522-eigpdur7u4l6vo5j9ltd0dnqe18m0qqn.apps.googleusercontent.com
